name: Isolated staging acceptance
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Isolated HTTPS test deployment (never production)
        required: true
      allow_takeaway_mutations:
        description: Create, record synthetic cash receipt and close a separate test order
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: isolated-staging
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_ISOLATED_PROJECT: 'true'
      E2E_SESSION_TOKEN: ${{ secrets.E2E_SESSION_TOKEN }}
      STAGING_PREFLIGHT_CONFIRMED_ISOLATED: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      E2E_ALLOW_TAKEAWAY_MUTATIONS: ${{ inputs.allow_takeaway_mutations }}
      E2E_TAKEAWAY_PHONE: ${{ secrets.E2E_TAKEAWAY_PHONE }}
      E2E_TAKEAWAY_BAR_NAME: ${{ vars.E2E_TAKEAWAY_BAR_NAME }}
      # JSON storageState comes from real test users; no fake Clerk JWT bypass.
      ADMIN_STATE: ${{ secrets.E2E_ADMIN_STATE }}
      STAFF_STATE: ${{ secrets.E2E_STAFF_STATE }}
      KITCHEN_STATE: ${{ secrets.E2E_KITCHEN_STATE }}
      INACTIVE_STATE: ${{ secrets.E2E_INACTIVE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:staging:preflight
      - name: Write ephemeral authentication fixtures without printing secrets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {mkdirSync,writeFileSync} from 'node:fs';
          if(!process.env.E2E_SESSION_TOKEN) throw new Error('Missing isolated session fixture');
          mkdirSync('.temp/e2e-auth',{recursive:true});
          for(const role of ['admin','staff','kitchen','inactive']) {
            const source=process.env[role.toUpperCase()+'_STATE'];
            if(!source) throw new Error('Missing isolated authentication fixture for '+role);
            const value=JSON.parse(source);
            writeFileSync('.temp/e2e-auth/'+role+'.json',JSON.stringify(value),{mode:0o600});
          }
          JS
      - run: npm run test:e2e
        env:
          E2E_ADMIN_STORAGE_STATE: .temp/e2e-auth/admin.json
          E2E_STAFF_STORAGE_STATE: .temp/e2e-auth/staff.json
          E2E_KITCHEN_STORAGE_STATE: .temp/e2e-auth/kitchen.json
          E2E_INACTIVE_STORAGE_STATE: .temp/e2e-auth/inactive.json
      # No traces/storageState are uploaded: they may contain capabilities/cookies.
